project_name: "PaperPilot-Lite"

data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  index_dir: "data/index"
  eval_dir: "data/eval"

chunking:
  chunk_size: 500
  overlap: 100

retrieval:
  top_k: 5

  # Retrieval strategy:
  # dense | keyword | hybrid
  mode: "hybrid"

  # Hybrid retrieval configuration.
  # alpha controls the dense contribution:
  # 1.0 = dense only
  # 0.0 = keyword only
  hybrid_alpha: 0.5

  # minmax | rrf
  fusion_method: "rrf"

  # Reciprocal Rank Fusion smoothing constant.
  rrf_k: 60

  # Dense retrieval configuration.
  embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
  similarity: "cosine"
  device: "cpu"
  batch_size: 32
  normalize_embeddings: true

prompt:
  template_name: "grounded"
  max_context_chars: 4000
  max_chunk_chars: 1200

llm:
  # Keep mock as the safe default so tests and local development
  # never make accidental paid API calls.
  provider: "mock"
  model_name: null
  base_url: null
  temperature: 0.2
  max_tokens: 512
  thinking_enabled: false
  timeout: 60

logging:
  log_file: "logs/app.log"
  level: "INFO"
